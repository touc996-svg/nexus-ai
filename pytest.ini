[pytest]
pythonpath = .
markers =
    integration_local_qdrant: real NexusRAG code and real qdrant-client in its in-process local mode; the Ollama embedding response is replayed from the committed cache (not a Qdrant server)
    unit_no_qdrant: pure unit test; no Qdrant client is created
    qdrant_server: needs a real Qdrant server (set EVALS_QDRANT_URL); skipped otherwise
