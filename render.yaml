services:
  - type: web
    name: nexus-ai-demo
    runtime: python
    plan: free
    region: virginia
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health/live
    autoDeployTrigger: commit
    envVars:
      - key: NEXUS_DEMO_MODE
        value: "true"
      - key: APP_ENV
        value: production
