name: NEXUS CI

on:
  push:
    branches: ["main", "feature/**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      NEXUS_DEMO_MODE: "true"
      APP_ENV: test
      NEXUS_EVALUATION_PATH: artifacts/test-evaluation.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --require-hashes -r requirements.txt
      - name: Compile Python modules
        run: python -m compileall -q app tests scripts
      - name: Run test suite
        run: python -m pytest -q
      - name: RAG quality gate (fails on regression vs evals/baseline.json)
        run: python -m evals.run --check
      - name: Validate installed dependencies
        run: python -m pip check
      - name: Audit locked dependencies for known vulnerabilities
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt --disable-pip
      - name: Verify no populated environment file is tracked
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "A populated .env file must not be tracked."
            exit 1
          fi

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build container (no push)
        run: docker build --tag nexus-ai:ci .

  postgres:
    name: PostgreSQL migrations and stores
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: nexus_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXUS_TEST_POSTGRES_URL: postgresql://postgres:ci-only-not-a-secret@localhost:5432/nexus_ci
      NEXUS_DEMO_MODE: "true"
      APP_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Run PostgreSQL tests
        run: python -m pytest -q tests/test_migrations.py tests/test_database_config.py

  qdrant:
    name: Qdrant server integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.20.0
        ports: ["6333:6333"]
      qdrant-auth:
        image: qdrant/qdrant:v1.20.0
        env:
          QDRANT__SERVICE__API_KEY: ci-only-not-a-secret-key
        ports: ["6334:6333"]
    env:
      NEXUS_TEST_QDRANT_URL: http://localhost:6333
      NEXUS_TEST_QDRANT_AUTH_URL: http://localhost:6334
      NEXUS_TEST_QDRANT_API_KEY: ci-only-not-a-secret-key
      EVALS_QDRANT_URL: http://localhost:6333
      NEXUS_DEMO_MODE: "true"
      APP_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Wait for Qdrant
        run: |
          for port in 6333 6334; do
            for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:$port/readyz && break; sleep 2; done
          done
      - name: Run Qdrant server tests
        run: python -m pytest -q tests/test_qdrant_server.py tests/test_qdrant_config.py tests/test_nexus_adapter.py -rs
