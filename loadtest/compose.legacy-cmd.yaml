# Comparison overlay (load tests only): the API started the way it was before app/serve.py, i.e. plain `uvicorn --workers N`,
# to measure the multi-worker keep-alive delay that app/serve.py fixes. See docs/LOAD_TEST_REPORT.md.
services:
  api:
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8010", "--no-proxy-headers", "--timeout-graceful-shutdown", "25"]
